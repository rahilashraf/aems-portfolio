[project]
name = "aems-backend"
version = "0.1.0"
description = "AEMS — Assessment & Examination Management System (backend)"
readme = "../README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "django>=5.2.8,<5.3",
    "django-environ>=0.12,<1.0",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "pip-audit>=2.9",
    "pre-commit>=4",
    "pytest>=8.4",
    "pytest-cov>=6",
    "pytest-django>=4.11",
    "ruff>=0.14",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "DJ",            # django
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "PT",            # pytest style
    "T20",           # no print
    "DTZ",           # timezone-aware datetimes
    "PL",            # pylint subset
    "N",             # naming
]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "PLR2004", "S105", "S106", "S603"]
"**/conftest.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["environ", "environ.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.tests.*", "tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps", "config", "scripts"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
# Measure settings modules imported in subprocess-based tests (production settings checks).
patch = ["subprocess"]
source = ["apps", "config", "scripts"]
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py", "manage.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
