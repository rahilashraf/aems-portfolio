components:
  schemas:
    AcceptedOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
      required:
      - id
      - name
      - status
    ApiRoot:
      type: object
      properties:
        service:
          type: string
        api_version:
          type: string
      required:
      - api_version
      - service
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        action:
          type: string
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_email:
          type: string
          format: email
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        changes:
          readOnly: true
        metadata:
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
      required:
      - action
      - actor
      - actor_email
      - changes
      - created_at
      - id
      - ip_address
      - metadata
      - organization
      - outcome
      - request_id
      - target_id
      - target_type
      - user_agent
    AuthSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_rotated_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        created_ip:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        current:
          type: boolean
          readOnly: true
      required:
      - created_at
      - created_ip
      - current
      - expires_at
      - id
      - last_rotated_at
      - user_agent
    CsrfResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    InitialOwnerInvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    Invitation:
      type: object
      description: Safe metadata for managers. Never the token or its digest.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        roles:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        status:
          type: string
          readOnly: true
        is_initial_owner:
          type: boolean
          readOnly: true
        invited_by:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        accepted_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        delivery_status:
          type: string
          nullable: true
          readOnly: true
      required:
      - accepted_at
      - accepted_by
      - created_at
      - delivery_status
      - email
      - expires_at
      - id
      - invited_by
      - is_initial_owner
      - organization
      - revoked_at
      - roles
      - status
    InvitationAcceptRequest:
      type: object
      description: |-
        New accounts only: full name and password. Signed-in invitees send an empty body.

        The address always comes from the invitation; ``email`` and privilege fields are rejected.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
    InvitationAccepted:
      type: object
      properties:
        organization:
          allOf:
          - $ref: '#/components/schemas/AcceptedOrganization'
          readOnly: true
        membership:
          allOf:
          - $ref: '#/components/schemas/MembershipSummary'
          readOnly: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/InvitationRole'
          readOnly: true
        account_created:
          type: boolean
          readOnly: true
      required:
      - account_created
      - membership
      - organization
      - roles
    InvitationCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        role_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
      required:
      - email
      - role_ids
    InvitationPreview:
      type: object
      properties:
        organization_name:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
          description: Masked invited address.
        status:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        next_step:
          allOf:
          - $ref: '#/components/schemas/NextStepEnum'
          readOnly: true
      required:
      - email
      - expires_at
      - next_step
      - organization_name
      - status
    InvitationRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        system_key:
          type: string
          readOnly: true
          nullable: true
      required:
      - id
      - name
      - system_key
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - expires_in
      - user
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/MemberUser'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/MembershipStatusEnum'
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
        roles:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - id
      - joined_at
      - roles
      - status
      - user
    MemberRolesRequest:
      type: object
      description: |-
        Role ids are resolved by the service within the URL organization only: an id of another
        organization is reported exactly like an id that does not exist.
      properties:
        role_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
      required:
      - role_ids
    MemberUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
      required:
      - email
      - full_name
      - id
    MembershipStatusEnum:
      enum:
      - active
      - suspended
      type: string
      description: |-
        * `active` - Active
        * `suspended` - Suspended
    MembershipSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/MembershipStatusEnum'
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - joined_at
      - status
    MyOrganization:
      type: object
      description: 'An entry of ``GET /organizations/``: the organization and the
        caller''s membership.'
      properties:
        organization:
          allOf:
          - $ref: '#/components/schemas/Organization'
          readOnly: true
        membership:
          allOf:
          - $ref: '#/components/schemas/MembershipSummary'
          readOnly: true
      required:
      - membership
      - organization
    MyRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        system_key:
          type: string
          readOnly: true
          nullable: true
      required:
      - id
      - name
      - system_key
    NextStepEnum:
      enum:
      - accept
      - sign_in_or_create_account
      type: string
      description: |-
        * `accept` - accept
        * `sign_in_or_create_account` - sign_in_or_create_account
    NullEnum:
      enum:
      - null
    Organization:
      type: object
      description: What members see about their organization (no lifecycle or platform
        metadata).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
        organization_type:
          allOf:
          - $ref: '#/components/schemas/OrganizationTypeEnum'
          readOnly: true
        timezone:
          type: string
          readOnly: true
      required:
      - id
      - name
      - organization_type
      - slug
      - timezone
    OrganizationMembership:
      type: object
      description: '``GET /organizations/{org_id}/me/``: membership, roles and effective
        permissions.'
      properties:
        organization:
          allOf:
          - $ref: '#/components/schemas/Organization'
          readOnly: true
        membership:
          allOf:
          - $ref: '#/components/schemas/MembershipSummary'
          readOnly: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/MyRole'
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - membership
      - organization
      - permissions
      - roles
    OrganizationStatusEnum:
      enum:
      - provisioning
      - active
      - suspended
      type: string
      description: |-
        * `provisioning` - Provisioning
        * `active` - Active
        * `suspended` - Suspended
    OrganizationTypeEnum:
      enum:
      - school
      - university
      - training
      - other
      type: string
      description: |-
        * `school` - School
        * `university` - University
        * `training` - Training provider
        * `other` - Other
    OutcomeEnum:
      enum:
      - success
      - failure
      type: string
      description: |-
        * `success` - Success
        * `failure` - Failure
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
      required:
      - current_password
      - new_password
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 64
        token:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
      required:
      - new_password
      - token
      - uid
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
      required:
      - email
    PatchedMemberStatusUpdateRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/MembershipStatusEnum'
    PatchedOrganizationProfileUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    PatchedPlatformOrganizationUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        organization_type:
          $ref: '#/components/schemas/OrganizationTypeEnum'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        status:
          $ref: '#/components/schemas/OrganizationStatusEnum'
    PatchedProfileUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
    PatchedRoleUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 255
        permissions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 50
    Permission:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
      required:
      - category
      - code
      - description
    PlatformOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
        organization_type:
          allOf:
          - $ref: '#/components/schemas/OrganizationTypeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrganizationStatusEnum'
          readOnly: true
        timezone:
          type: string
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - name
      - organization_type
      - slug
      - status
      - timezone
      - updated_at
    PlatformOrganizationCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 63
        organization_type:
          $ref: '#/components/schemas/OrganizationTypeEnum'
        timezone:
          type: string
          minLength: 1
          default: UTC
          maxLength: 64
        initial_owner_email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - initial_owner_email
      - name
      - organization_type
      - slug
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details. Served as `application/problem+json`.
        `code` is the stable identifier clients should branch on.
      required:
      - type
      - title
      - status
      - detail
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: The request contains invalid data.
        code:
          type: string
          example: validation_error
        request_id:
          type: string
          nullable: true
          description: Correlation ID; also returned in the X-Request-ID header.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemFieldError'
    ProblemFieldError:
      type: object
      description: A single field or query-parameter validation error.
      required:
      - detail
      - code
      properties:
        detail:
          type: string
          description: Human-readable message.
        code:
          type: string
          description: Stable machine-readable error code.
        pointer:
          type: string
          description: JSON Pointer (URI fragment form) to the invalid request-body
            member.
          example: '#/name'
        parameter:
          type: string
          description: Name of the invalid query parameter.
          example: page_size
    RevokedCount:
      type: object
      properties:
        revoked:
          type: integer
      required:
      - revoked
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        is_system:
          type: boolean
          readOnly: true
        system_key:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/SystemKeyEnum'
          - $ref: '#/components/schemas/NullEnum'
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - id
      - is_system
      - name
      - permissions
      - system_key
      - updated_at
    RoleCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 255
        permissions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 50
      required:
      - name
    SystemKeyEnum:
      enum:
      - owner
      - admin
      - member
      type: string
      description: |-
        * `owner` - Owner
        * `admin` - Admin
        * `member` - Member
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
      required:
      - access_token
      - expires_in
    User:
      type: object
      description: The authenticated user's own profile. Never exposes password data.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          maxLength: 255
        is_staff:
          type: boolean
          readOnly: true
          description: 'Platform staff: may sign in to the administration site.'
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - email
      - full_name
      - id
      - is_staff
      - last_login
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from /api/v1/auth/login/ or /api/v1/auth/token/refresh/.
        Validated against the server-side session on every request.
