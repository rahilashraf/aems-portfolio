        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh
      description: Cookie-authenticated (CSRF required). Returns a new access token
        and rotates the refresh cookie. Reusing an already-rotated refresh token revokes
        the whole session.
      summary: Rotate the refresh token
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Value of the csrftoken cookie (from GET /api/v1/auth/csrf/).
      - in: cookie
        name: aems_refresh
        schema:
          type: string
        description: HttpOnly refresh-token cookie (Path=/api/v1/auth/). Requires
          X-CSRFToken.
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/invitations/{token}/:
    get:
      operationId: invitations_preview
      description: Public. Returns the organization name, the masked invited address,
        the expiry and the next step. Unknown, expired, revoked and used tokens all
        answer the same 404 `invitation_invalid`. Whether an account exists for the
        address is not revealed.
      summary: Preview an invitation
      parameters:
      - in: path
        name: token
        schema:
          type: string
        description: The invitation token from the emailed link. Treat it as a credential.
        required: true
      tags:
      - invitations
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/invitations/{token}/accept/:
    post:
      operationId: invitations_accept
      description: Public. If an account exists for the invited address, sign in as
        that account (bearer token) and send an empty body; otherwise 401 `sign_in_required`,
        and another signed-in account gets 403 `invitation_email_mismatch`. If no
        account exists, send `full_name` and `password` to create it with the invited
        address. Membership, roles, invitation consumption and, for the initial Owner,
        organization activation happen in one transaction.
      summary: Accept an invitation
      parameters:
      - in: path
        name: token
        schema:
          type: string
        description: The invitation token from the emailed link. Treat it as a credential.
        required: true
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAccepted'
          description: ''
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/organizations/:
    get:
      operationId: organizations_list
      description: Organizations where the caller has an active membership and the
        organization is active. Provisioning and suspended organizations and suspended
        memberships are not listed.
      summary: List my organizations
      tags:
      - organizations
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyOrganization'
          description: ''
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/organizations/{org_id}/:
    get:
      operationId: organizations_retrieve
      description: Requires the `organization.view` permission (held by the default
        Member, Admin and Owner roles). Every active member can still read their own
        membership, roles and permissions at `GET /organizations/{org_id}/me/`.
      summary: Get the organization
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      operationId: organizations_update
      description: 'Requires the `organization.update` permission. Editable: `name`,
        `timezone`. The slug, type and status cannot be changed here.'
      summary: Update the organization profile
      parameters:
      - in: path
        name: org_id
