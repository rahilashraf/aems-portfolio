openapi: 3.0.3
info:
  title: AEMS API
  version: v1
  description: Assessment & Examination Management System REST API. Errors use RFC
    9457 Problem Details (`application/problem+json`).
paths:
  /api/v1/:
    get:
      operationId: api_root
      description: Identifies the service and API version. Does not require authentication.
      summary: API root
      tags:
      - meta
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
          description: ''
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf
      description: Sets the `csrftoken` cookie used as `X-CSRFToken` on cookie-authenticated
        calls.
      summary: Issue the CSRF cookie
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
          description: ''
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: Returns a short-lived access token and sets the HttpOnly refresh-token
        cookie. Unknown accounts, wrong passwords and inactive accounts all return
        the same 401.
      summary: Sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: Revokes the current session (identified by the refresh cookie,
        with CSRF, or by the bearer token) and clears the refresh cookie. Always 204.
      summary: Sign out
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Value of the csrftoken cookie (from GET /api/v1/auth/csrf/).
      - in: cookie
        name: aems_refresh
        schema:
          type: string
        description: HttpOnly refresh-token cookie (Path=/api/v1/auth/). Requires
          X-CSRFToken.
      tags:
      - auth
      responses:
        '204':
          description: No response body
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        Mixin for every DRF view: refuse unauthenticated access to non-allowlisted endpoints.

        Runs after DRF's own permission checks, whatever produced them (class attributes,
        ``get_permissions()`` overrides, ViewSet actions or custom permission classes).
      summary: Current user
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      operationId: auth_me_update
      description: |-
        Mixin for every DRF view: refuse unauthenticated access to non-allowlisted endpoints.

        Runs after DRF's own permission checks, whatever produced them (class attributes,
        ``get_permissions()`` overrides, ViewSet actions or custom permission classes).
      summary: Update the current user's profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change
      description: Requires the current password. Revokes every session (all devices)
        and returns a fresh access token plus a new refresh cookie for the caller.
      summary: Change password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_request
      description: Always returns 202 with the same body and headers, whether or not
        the account exists. The email is queued, not sent, during the request and
        is delivered later by the `deliver_password_reset_emails` command; 202 means
        accepted, not delivered.
      summary: Request a password reset email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm
      description: Single-use, expiring token. Revokes every existing session on success.
      summary: Set a new password with a reset token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/sessions/:
    get:
      operationId: auth_sessions_list
      description: |-
        Mixin for every DRF view: refuse unauthenticated access to non-allowlisted endpoints.

        Runs after DRF's own permission checks, whatever produced them (class attributes,
        ``get_permissions()`` overrides, ViewSet actions or custom permission classes).
      summary: List the current user's active sessions
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/sessions/{session_id}/:
    delete:
      operationId: auth_sessions_revoke
      description: |-
        Mixin for every DRF view: refuse unauthenticated access to non-allowlisted endpoints.

        Runs after DRF's own permission checks, whatever produced them (class attributes,
        ``get_permissions()`` overrides, ViewSet actions or custom permission classes).
      summary: Revoke one of the current user's sessions
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/sessions/revoke-others/:
    post:
      operationId: auth_sessions_revoke_others
      description: |-
        Mixin for every DRF view: refuse unauthenticated access to non-allowlisted endpoints.

        Runs after DRF's own permission checks, whatever produced them (class attributes,
        ``get_permissions()`` overrides, ViewSet actions or custom permission classes).
      summary: Revoke all of the current user's other sessions
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedCount'
          description: ''
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh
      description: Cookie-authenticated (CSRF required). Returns a new access token
        and rotates the refresh cookie. Reusing an already-rotated refresh token revokes
        the whole session.
      summary: Rotate the refresh token
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Value of the csrftoken cookie (from GET /api/v1/auth/csrf/).
      - in: cookie
        name: aems_refresh
        schema:
          type: string
        description: HttpOnly refresh-token cookie (Path=/api/v1/auth/). Requires
          X-CSRFToken.
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    ApiRoot:
      type: object
      properties:
        service:
          type: string
        api_version:
          type: string
      required:
      - api_version
      - service
    AuthSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_rotated_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        created_ip:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        current:
          type: boolean
          readOnly: true
      required:
      - created_at
      - created_ip
      - current
      - expires_at
      - id
      - last_rotated_at
      - user_agent
    CsrfResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - expires_in
      - user
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
      required:
      - current_password
      - new_password
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 64
        token:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
      required:
      - new_password
      - token
      - uid
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
      required:
      - email
    PatchedProfileUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details. Served as `application/problem+json`.
        `code` is the stable identifier clients should branch on.
      required:
      - type
      - title
      - status
      - detail
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: The request contains invalid data.
        code:
          type: string
          example: validation_error
        request_id:
          type: string
          nullable: true
          description: Correlation ID; also returned in the X-Request-ID header.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemFieldError'
    ProblemFieldError:
      type: object
      description: A single field or query-parameter validation error.
      required:
      - detail
      - code
      properties:
        detail:
          type: string
          description: Human-readable message.
        code:
          type: string
          description: Stable machine-readable error code.
        pointer:
          type: string
          description: JSON Pointer (URI fragment form) to the invalid request-body
            member.
          example: '#/name'
        parameter:
          type: string
          description: Name of the invalid query parameter.
          example: page_size
    RevokedCount:
      type: object
      properties:
        revoked:
          type: integer
      required:
      - revoked
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
      required:
      - access_token
      - expires_in
    User:
      type: object
      description: The authenticated user's own profile. Never exposes password data.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          maxLength: 255
        is_staff:
          type: boolean
          readOnly: true
          description: 'Platform staff: may sign in to the administration site.'
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - email
      - full_name
      - id
      - is_staff
      - last_login
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from /api/v1/auth/login/ or /api/v1/auth/token/refresh/.
        Validated against the server-side session on every request.
