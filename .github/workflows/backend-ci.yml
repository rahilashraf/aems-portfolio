# Backend continuous integration.
#
# Runs on every pull request targeting main and every push to main, with no path filters, so the
# required checks always report a result and cannot be skipped by touching only "unrelated" files.
# Uses no secrets and no production credentials; the passwords below are throwaway values for the
# ephemeral CI database. Nothing is deployed or published.
#
# Recommended required status checks for main (see docs/adr/0011-continuous-integration.md):
#   "Backend CI result" (aggregates every job below)
name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.11.32"
  UV_NO_PROGRESS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: make install

      - name: Ruff lint and format check
        run: make lint

      - name: Strict mypy
        run: make typecheck

      - name: Repository hygiene hooks
        env:
          # Checked by dedicated steps/jobs, or not meaningful in CI (branch protection hook).
          SKIP: no-commit-to-branch,ruff-check,ruff-format,mypy,detect-secrets
        run: uv run --project backend pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests & migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-superuser-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-insecure-secret-key-not-used-outside-this-workflow
      DJANGO_JWT_SIGNING_KEY: ci-only-insecure-jwt-signing-key-not-used-outside-this-workflow
      # Runtime role (what the application connects as) and owner role (migrations, test suite);
      # the Makefile runs migrations and tests as the owner (ADR-0016).
      DATABASE_URL: postgres://aems_app:ci-only-app-password@localhost:5432/aems
      DATABASE_OWNER_URL: postgres://aems_owner:ci-only-owner-password@localhost:5432/aems
      DJANGO_DB_RUNTIME_ROLE: aems_app
      # Database-privilege tests must run here, never be skipped.
      AEMS_REQUIRE_RUNTIME_ROLE_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: make install

      - name: Create the owner and runtime database roles
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: ci-only-superuser-password
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          AEMS_DB_NAME: aems
          AEMS_DB_OWNER: aems_owner
          AEMS_DB_OWNER_PASSWORD: ci-only-owner-password
          AEMS_DB_USER: aems_app
          AEMS_DB_PASSWORD: ci-only-app-password
        run: |
          bash docker/postgres/init/01-create-app-role.sh
          roles="$(psql -U postgres -d postgres -tAc "SELECT rolname || ':' || rolsuper || ':' || rolcreatedb FROM pg_roles WHERE rolname IN ('aems_owner', 'aems_app') ORDER BY 1")"
          echo "$roles"
          test "$roles" = "$(printf 'aems_app:false:false\naems_owner:false:true')" \
            || { echo "Unexpected role attributes"; exit 1; }
          echo "Neither role is a superuser; only the owner can create (test) databases"

      - name: Django system checks
        run: make check

      - name: Fresh database migration
        run: make migrate

      - name: Verify no default auth tables exist
        run: make check-no-auth-tables

      - name: Verify runtime role privileges (audit log read/append only)
        run: make verify-runtime-privileges

      - name: Migration drift check (application settings)
        run: make check-migrations

      - name: Migration drift check (test settings, includes fixture app)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: make check-migrations

      - name: Test suite with branch coverage (90% gate)
        run: make test PYTEST_ARGS="--cov-report=xml:coverage.xml --junitxml=junit.xml"

      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/junit.xml
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: make install

      - name: Bandit static analysis
        run: make security

      - name: Dependency vulnerability audit
        run: make audit

      - name: Secret detection
        run: make secrets

      - name: Production deployment checks
        run: make deploy-check

  api-contract:
    name: API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: make install

      - name: Generate, validate and compare OpenAPI schema
        run: make schema-check

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGE: aems-backend:ci
      API_HOST: api.example.org
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate docker-compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "docker-compose.yml is valid"

      - name: Build production image (committed Dockerfile, no cache)
        run: docker build --pull --no-cache --target prod --tag "$IMAGE" backend

      - name: Verify image runs as a non-root user without dev tooling
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          echo "Configured user: $user"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"
          uid="$(docker run --rm --entrypoint id "$IMAGE" -u)"
          echo "Runtime uid: $uid"
          test "$uid" != "0"
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v uv || command -v pytest || command -v ruff'; then
            echo "Development tooling found in production image"; exit 1
          fi

      - name: Production settings refuse unsafe configuration
        run: |
          if docker run --rm -e DJANGO_DEBUG=true -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" \
               -e DJANGO_JWT_SIGNING_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" \
               -e DJANGO_ALLOWED_HOSTS="$API_HOST" -e DATABASE_URL=postgres://u:p@db:5432/db \
               --entrypoint python "$IMAGE" -c 'import django; django.setup()' 2> /tmp/refusal.txt; then
            echo "Production settings accepted DJANGO_DEBUG=true"; exit 1
          fi
          grep -q "DJANGO_DEBUG must be false in production" /tmp/refusal.txt
          echo "DJANGO_DEBUG=true correctly refused"

      - name: Start PostgreSQL for the container
        run: |
          docker network create aems-ci
          docker run -d --name aems-db --network aems-ci \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=ci-only-superuser-password -e POSTGRES_DB=postgres \
            -e AEMS_DB_NAME=aems -e AEMS_DB_USER=aems_app -e AEMS_DB_PASSWORD=ci-only-app-password \
            -e AEMS_DB_OWNER=aems_owner -e AEMS_DB_OWNER_PASSWORD=ci-only-owner-password \
            -v "$PWD/docker/postgres/init:/docker-entrypoint-initdb.d:ro" \
            --health-cmd "pg_isready -U postgres -d aems" --health-interval 2s --health-retries 30 \
            postgres:17-alpine
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' aems-db)" = healthy ] && exit 0
            sleep 2
          done
          docker logs aems-db; exit 1

      - name: Start Mailpit for password-reset delivery
        run: |
          docker run -d --name aems-mail --network aems-ci -p 127.0.0.1:8025:8025 \
            axllent/mailpit:v1.27
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8025/api/v1/messages && exit 0
            sleep 1
          done
          docker logs aems-mail; exit 1

      - name: Start the production container
        run: |
          docker run -d --name aems-api --network aems-ci -p 127.0.0.1:8000:8000 \
            -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" \
            -e DJANGO_JWT_SIGNING_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" \
            -e DJANGO_ALLOWED_HOSTS="$API_HOST" \
            -e AEMS_FRONTEND_BASE_URL=https://app.example.org \
            -e DJANGO_BEHIND_TLS_PROXY=true \
            -e DATABASE_URL=postgres://aems_app:ci-only-app-password@aems-db:5432/aems \
            -e EMAIL_URL=smtp://aems-mail:1025 \
            -e AEMS_EMAIL_ALLOW_UNENCRYPTED_SMTP=true \
            "$IMAGE"

      - name: Wait for the image HEALTHCHECK to report healthy
        run: |
          for _ in $(seq 1 36); do
            status="$(docker inspect -f '{{.State.Health.Status}}' aems-api)"
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 5
          done
          docker inspect -f '{{json .State.Health}}' aems-api
          docker logs aems-api
          exit 1

      - name: Verify health and API endpoint behaviour
        run: |
          base=http://127.0.0.1:8000
          expect() {  # expect <status> <path> [extra curl args...]
            local want="$1" path="$2"; shift 2
            local got
            got="$(curl -sS -o /tmp/body -w '%{http_code}' -H "Host: $API_HOST" "$@" "$base$path")"
            echo "$path -> $got (expected $want)"
            [ "$got" = "$want" ] || { cat /tmp/body; exit 1; }
          }
          tls=(-H "X-Forwarded-Proto: https")  # as set by the trusted TLS-terminating proxy
          # Health probes are exempt from the HTTPS redirect (in-cluster plain HTTP).
          expect 200 /health/live/
          expect 200 /health/ready/
          # Everything else is redirected to HTTPS unless it arrived via the TLS proxy.
          expect 301 /api/v1/
          expect 200 /api/v1/ "${tls[@]}"
          grep -Eq '"api_version": ?"v1"' /tmp/body
          # API documentation is disabled in production.
          expect 404 /api/docs/ "${tls[@]}"
          grep -Eq '"code": ?"not_found"' /tmp/body
          expect 404 /api/schema/ "${tls[@]}"
          curl -sS -D - -o /dev/null -H "Host: $API_HOST" "${tls[@]}" "$base/api/v1/" \
            | grep -qi '^x-request-id:'
          # Host validation stays enforced: a loopback Host header is rejected.
          got="$(curl -sS -o /dev/null -w '%{http_code}' "$base/health/live/")"
          echo "loopback Host -> $got (expected 400)"
          test "$got" = 400

      - name: Migrate inside the production container and exercise authentication
        run: |
          # Migrations run as the owner role and grant the runtime role its privileges.
          docker exec -e DATABASE_URL=postgres://aems_owner:ci-only-owner-password@aems-db:5432/aems \
            -e DJANGO_DB_RUNTIME_ROLE=aems_app aems-api python manage.py migrate --noinput
          docker exec aems-api python manage.py verify_no_default_tables
          docker exec aems-api python manage.py verify_runtime_privileges
          base=http://127.0.0.1:8000
          got="$(curl -sS -o /tmp/login.json -w '%{http_code}' -H "Host: $API_HOST" \
            -H "X-Forwarded-Proto: https" -H "Content-Type: application/json" \
            -d '{"email": "nobody@example.org", "password": "not-a-real-password"}' \
            "$base/api/v1/auth/login/")"
          echo "POST /api/v1/auth/login/ (unknown account) -> $got (expected 401)"
          test "$got" = 401
          grep -Eq '"code": ?"invalid_credentials"' /tmp/login.json
          got="$(curl -sS -o /dev/null -w '%{http_code}' -H "Host: $API_HOST" \
            -H "X-Forwarded-Proto: https" "$base/api/v1/auth/me/")"
          echo "GET /api/v1/auth/me/ (no token) -> $got (expected 401)"
          test "$got" = 401

      - name: Password reset is queued in the request and delivered to Mailpit by the command
        run: |
          base=http://127.0.0.1:8000
          mailpit=http://127.0.0.1:8025
          account=reset-e2e@example.org
          docker exec \
            -e DJANGO_SUPERUSER_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" \
            -e DJANGO_SUPERUSER_FULL_NAME="Reset E2E" \
            aems-api python manage.py createsuperuser --noinput --email "$account" > /dev/null
          reset() {  # reset <email> <name>: status code; headers and body saved under /tmp/<name>.*
            curl -sS -D "/tmp/$2.headers" -o "/tmp/$2.body" -w '%{http_code}' \
              -H "Host: $API_HOST" -H "X-Forwarded-Proto: https" -H "Content-Type: application/json" \
              -d "{\"email\": \"$1\"}" "$base/api/v1/auth/password/reset/"
          }
          headers() { grep -viE '^(date|x-request-id):' "/tmp/$1.headers" | tr -d '\r' | sort; }
          messages() { curl -fsS "$mailpit/api/v1/messages" | python3 -c 'import json, sys; print(json.load(sys.stdin)["total"])'; }

          known="$(reset "$account" known)"; unknown="$(reset nobody-e2e@example.org unknown)"
          echo "reset (existing account) -> $known, reset (unknown account) -> $unknown (expected 202)"
          test "$known" = 202 && test "$unknown" = 202
          cmp /tmp/known.body /tmp/unknown.body
          diff <(headers known) <(headers unknown)
          echo "Bodies and headers are identical"
          test "$(messages)" = 0 || { echo "Email was sent during the request"; exit 1; }
          echo "No email was sent during the request"

          docker exec aems-api python manage.py deliver_password_reset_emails --status
          out="$(docker exec aems-api python manage.py deliver_password_reset_emails)"
          echo "$out"
          grep -q 'delivered=1' <<<"$out"
          test "$(messages)" = 1

          # Complete the reset with the emailed link. The token is never printed.
          python3 - "$mailpit" "$base" "$API_HOST" "$account" <<'PY'
          import json, re, sys, urllib.error, urllib.request

          mailpit, base, host, account = sys.argv[1:]
          [summary] = json.load(urllib.request.urlopen(f"{mailpit}/api/v1/messages"))["messages"]
          assert [to["Address"] for to in summary["To"]] == [account], "unexpected recipient"
          text = json.load(urllib.request.urlopen(f"{mailpit}/api/v1/message/{summary['ID']}"))["Text"]
          link = re.search(r"/reset-password#uid=([^&\s]+)&token=(\S+)", text)
          assert link, "no reset link (token in the URL fragment) in the email"

          def confirm(password):
              body = json.dumps({"uid": link[1], "token": link[2], "new_password": password}).encode()
              request = urllib.request.Request(
                  f"{base}/api/v1/auth/password/reset/confirm/", data=body, method="POST",
                  headers={"Host": host, "X-Forwarded-Proto": "https", "Content-Type": "application/json"},
              )
              try:
                  return urllib.request.urlopen(request).status
              except urllib.error.HTTPError as exc:
                  return exc.code

          first, reused = confirm("Ci-Reset-Passphrase-2026"), confirm("Ci-Reset-Passphrase-2027")
          print(f"confirm with emailed link -> {first} (expected 204); reuse -> {reused} (expected 400)")
          assert (first, reused) == (204, 400)
          PY

          out="$(docker exec aems-api python manage.py deliver_password_reset_emails)"
          echo "$out"
          grep -q 'claimed=0' <<<"$out"
          test "$(messages)" = 1
          echo "Delivered exactly once; the link was single-use"

      - name: Organization administration and tenant isolation against the production container
        run: |
          base=http://127.0.0.1:8000
          hdr=(-H "Host: $API_HOST" -H "X-Forwarded-Proto: https" -H "Content-Type: application/json")
          password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker exec -e DJANGO_SUPERUSER_PASSWORD="$password" -e DJANGO_SUPERUSER_FULL_NAME="Platform E2E" \
            aems-api python manage.py createsuperuser --noinput --email platform-e2e@example.org > /dev/null
          token="$(curl -fsS "${hdr[@]}" -d "{\"email\": \"platform-e2e@example.org\", \"password\": \"$password\"}" \
            "$base/api/v1/auth/login/" | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')"
          auth=(-H "Authorization: Bearer $token")
          call() {  # call <expected status> <method> <path> [json body]: response saved to /tmp/org.json
            local want="$1" method="$2" path="$3" body="${4:-}" got
            got="$(curl -sS -o /tmp/org.json -w '%{http_code}' -X "$method" "${hdr[@]}" "${auth[@]}" \
              ${body:+-d "$body"} "$base$path")"
            echo "$method $path -> $got (expected $want)"
            [ "$got" = "$want" ] || { cat /tmp/org.json; exit 1; }
          }
          field() { python3 -c "import json; print(json.load(open('/tmp/org.json'))$1)"; }

          call 201 POST /api/v1/platform/organizations/ \
            '{"name": "CI Academy", "slug": "CI-Academy", "organization_type": "school", "timezone": "Europe/London", "initial_owner_email": "owner@ci-academy.example.org"}'
          org_id="$(field '["id"]')"
          test "$(field '["status"]')" = provisioning
          test "$(field '["slug"]')" = ci-academy
          call 409 PATCH "/api/v1/platform/organizations/$org_id/" '{"status": "active"}'
          grep -q organization_status_transition_not_allowed /tmp/org.json
          call 400 PATCH "/api/v1/platform/organizations/$org_id/" '{"slug": "renamed"}'
          call 200 GET "/api/v1/platform/organizations/?status=provisioning"
          test "$(field '["count"]')" = 1
          # Platform administration grants no tenant access, and provisioning organizations are closed.
          call 404 GET "/api/v1/organizations/$org_id/"
          call 404 GET "/api/v1/organizations/$org_id/me/"
          call 200 GET /api/v1/organizations/
          test "$(field '["count"]')" = 0
          auth=()
          call 401 GET /api/v1/organizations/
          call 401 GET "/api/v1/platform/organizations/"

      - name: Audit records are durable and append-only in the production database
        run: |
          as_role() {  # as_role <role> <password> <sql>: run SQL inside the database container
            docker exec -e PGPASSWORD="$2" aems-db psql -h localhost -U "$1" -d aems -v ON_ERROR_STOP=1 -tAc "$3"
          }
          expect_error() {  # expect_error <role> <password> <sql> <expected message fragment>
            if out="$(as_role "$1" "$2" "$3" 2>&1)"; then echo "Unexpectedly succeeded: $3"; exit 1; fi
            echo "$1> $3 -> $out"
            grep -q "$4" <<<"$out"
          }
          # Earlier steps produced audit records through the API and the delivery command.
          for action in auth.login.failed auth.password_reset.requested auth.password_reset.email_delivered \
                        auth.password_reset.completed organization.created tenant.access_denied; do
            n="$(as_role aems_app ci-only-app-password "SELECT count(*) FROM audit_auditlog WHERE action = '$action'")"
            echo "$action: $n"
            test "$n" -ge 1
          done
          expect_error aems_app ci-only-app-password "UPDATE audit_auditlog SET action = 'tampered.event'" "permission denied"
          expect_error aems_app ci-only-app-password "DELETE FROM audit_auditlog" "permission denied"
          expect_error aems_app ci-only-app-password "TRUNCATE audit_auditlog" "permission denied"
          expect_error aems_app ci-only-app-password "ALTER TABLE audit_auditlog DISABLE TRIGGER audit_auditlog_append_only" "must be owner"
          expect_error aems_owner ci-only-owner-password "UPDATE audit_auditlog SET action = 'tampered.event'" "append-only"
          expect_error aems_owner ci-only-owner-password "DELETE FROM audit_auditlog" "append-only"
          echo "Runtime role cannot change audit history; the trigger stops the owner role too"

      - name: RBAC catalog, system roles and database safeguards in the production database
        run: |
          as_role() {  # as_role <role> <password> <sql>: run SQL inside the database container
            docker exec -e PGPASSWORD="$2" aems-db psql -h localhost -U "$1" -d aems -v ON_ERROR_STOP=1 -tAc "$3"
          }
          expect_error() {  # expect_error <role> <password> <sql> <expected message fragment>
            if out="$(as_role "$1" "$2" "$3" 2>&1)"; then echo "Unexpectedly succeeded: $3"; exit 1; fi
            echo "$1> $3 -> $out"
            grep -q "$4" <<<"$out"
          }
          app=(aems_app ci-only-app-password)
          # The migrate step synced the catalog; the organization created through the API has its
          # system role definitions but nobody holds the Owner role (no activation shortcut).
          test "$(as_role "${app[@]}" "SELECT count(*) FROM rbac_permission WHERE NOT is_deprecated")" = 8
          roles="$(as_role "${app[@]}" "SELECT string_agg(r.system_key, ',' ORDER BY r.system_key) FROM rbac_role r JOIN organizations_organization o ON o.id = r.organization_id WHERE o.slug = 'ci-academy'")"
          echo "ci-academy system roles: $roles"
          test "$roles" = "admin,member,owner"
          test "$(as_role "${app[@]}" "SELECT count(*) FROM rbac_membershiprole")" = 0
          test "$(as_role "${app[@]}" "SELECT status FROM organizations_organization WHERE slug = 'ci-academy'")" = provisioning
          expect_error "${app[@]}" "DELETE FROM rbac_permission" "cannot be deleted"
          expect_error "${app[@]}" "UPDATE rbac_permission SET code = 'audit.read' WHERE code = 'audit.view'" "immutable"
          echo "Catalog synced, roles seeded without an Owner, permission rows protected"

      - name: Initial Owner onboarding through the emailed invitation activates the organization
        run: |
          base=http://127.0.0.1:8000
          mailpit=http://127.0.0.1:8025
          # Creating the organization queued the initial Owner invitation; nothing was sent yet.
          docker exec aems-api python manage.py deliver_invitation_emails --status
          out="$(docker exec aems-api python manage.py deliver_invitation_emails)"
          echo "$out"
          grep -q 'delivered=1' <<<"$out"
          # Preview and accept with the emailed link, as a new account. The token is never printed.
          python3 - "$mailpit" "$base" "$API_HOST" <<'PY'
          import json, re, sys, urllib.error, urllib.request

          mailpit, base, host = sys.argv[1:]
          owner = "owner@ci-academy.example.org"
          messages = json.load(urllib.request.urlopen(f"{mailpit}/api/v1/messages"))["messages"]
          [summary] = [m for m in messages if [t["Address"] for t in m["To"]] == [owner]]
          text = json.load(urllib.request.urlopen(f"{mailpit}/api/v1/message/{summary['ID']}"))["Text"]
          assert "CI Academy" in text
          link = re.search(r"/invitations/accept#token=([A-Za-z0-9_-]{43})", text)
          assert link, "no invitation link (token in the URL fragment) in the email"
          token = link[1]

          def call(method, path, body=None, bearer=None):
              headers = {"Host": host, "X-Forwarded-Proto": "https", "Content-Type": "application/json"}
              if bearer:
                  headers["Authorization"] = f"Bearer {bearer}"
              data = json.dumps(body).encode() if body is not None else None
              request = urllib.request.Request(f"{base}{path}", data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(request) as response:
                      return response.status, dict(response.headers), json.load(response)
              except urllib.error.HTTPError as exc:
                  return exc.code, dict(exc.headers), json.load(exc)

          status, headers, preview = call("GET", f"/api/v1/invitations/{token}/")
          print(f"preview -> {status} (expected 200), next step {preview.get('next_step')}")
          assert status == 200 and preview["organization_name"] == "CI Academy"
          assert preview["email"] != owner and preview["email"].endswith("@ci-academy.example.org")
          assert headers.get("Cache-Control") == "no-store, private"
          assert headers.get("Referrer-Policy") == "no-referrer"

          password = "Ci-Owner-Passphrase-2026"
          status, _, accepted = call(
              "POST", f"/api/v1/invitations/{token}/accept/", {"full_name": "CI Owner", "password": password}
          )
          print(f"accept -> {status} (expected 200), organization {accepted.get('organization', {}).get('status')}")
          assert status == 200 and accepted["organization"]["status"] == "active"
          assert [r["system_key"] for r in accepted["roles"]] == ["owner"]
          org_id = accepted["organization"]["id"]

          reused, _, body = call("POST", f"/api/v1/invitations/{token}/accept/", {"full_name": "X", "password": password})
          print(f"reuse -> {reused} (expected 404 {body.get('code')})")
          assert reused == 404

          status, _, login = call("POST", "/api/v1/auth/login/", {"email": owner, "password": password})
          assert status == 200
          status, _, me = call("GET", f"/api/v1/organizations/{org_id}/me/", bearer=login["access_token"])
          print(f"owner GET me/ -> {status} (expected 200), roles {[r['system_key'] for r in me['roles']]}")
          assert status == 200 and [r["system_key"] for r in me["roles"]] == ["owner"]
          PY
          as_app() {
            docker exec -e PGPASSWORD=ci-only-app-password aems-db psql -h localhost -U aems_app -d aems -v ON_ERROR_STOP=1 -tAc "$1"
          }
          test "$(as_app "SELECT status FROM organizations_organization WHERE slug = 'ci-academy'")" = active
          test "$(as_app "SELECT status FROM organizations_invitation WHERE email = 'owner@ci-academy.example.org'")" = accepted
          for action in invitation.initial_owner_issued invitation.email_delivered invitation.accepted rbac.owner.granted organization.activated; do
            test "$(as_app "SELECT count(*) FROM audit_auditlog WHERE action = '$action'")" -ge 1
          done
          # The accepted invitation is immutable, and the database never held the raw token.
          if out="$(as_app "UPDATE organizations_invitation SET status = 'pending', accepted_at = NULL, accepted_by_id = NULL" 2>&1)"; then
            echo "Accepted invitation was reopened"; exit 1
          fi
          grep -q "can no longer change" <<<"$out"
          echo "Organization activated by the initial Owner invitation; invitation single-use and immutable"

      - name: Show container logs
        if: always()
        run: docker logs aems-api 2>&1 | tail -n 100 || true

  result:
    name: Backend CI result
    if: always()
    needs: [lint, test, security, api-contract, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every backend job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "A required job did not succeed."; exit 1; }
          done
          echo "All backend CI jobs succeeded."
